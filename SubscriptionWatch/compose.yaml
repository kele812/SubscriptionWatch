name: subscriptionwatch-v2
services:
  watch:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      COOKIE_SECURE: "true"
    volumes:
      - watch-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  watch-data:
